<html lang="en">

    <link rel="stylesheet" href="https://unpkg.com/@knadh/oat/oat.min.css">

    <style>
        body { max-width: 900px; margin: 0 auto; }
        .tools-grid { margin-top: 1.5rem; }
        .tools-grid .card { transition: transform 0.15s; }
        .tools-grid .card:hover { transform: translateY(-2px); }
        .tools-grid a { text-decoration: none; color: inherit; }
    </style>
</head>
<body>
    <nav data-topnav>
        <div class="row">
            <div class="col-6 branding">
                <a href="/">&#8592; Home</a>
                <strong>Tools</strong>
            </div>
        </div>
    </nav>

    <main>
        <div class="container">
            <div class="row tools-grid">
                <div class="col-4">
                    <a href="/tools/qr-code/">
                        <article class="card">
                            <h3>QR Code Generator</h3>
                            <p><small class="text-light">Generate QR codes from any text or URL</small></p>
                        </article>
                    </a>
                </div>
                <div class="col-4">
                    <a href="/tools/guitar-tuner/">
                        <article class="card">
                            <h3>Guitar Tuner</h3>
                            <p><small class="text-light">Reference tones for standard and alternate tunings</small></p>
                        </article>
                    </a>
                </div>
                <div class="col-4">
                    <a href="/tools/weather/">
                        <article class="card">
                            <h3>Fishing Weather</h3>
                            <p><small class="text-light">Surf, swell, and weather for Silver Strand Beach</small></p>
                        </article>
                    </a>
                </div>
            </div>
        </div>
    </main>
</body>
